<!-- ============ TAKEAWAYS ============ -->
<section id="takeaways" class="sec sec-first">
  <div class="sec-head">

    <h2 data-en="What a habitat designer should do differently" data-pl="Co projektant habitatu powinien zrobić inaczej"></h2>
    <p class="sec-lede"
       data-en="Four suggestions read from the data. Each card gives one number, what it suggests, where that number stops being valid, and a link to the investigation it comes from — click it to see the source."
       data-pl="Cztery sugestie odczytane z danych. Każda karta podaje jedną liczbę, co z niej wynika, gdzie ta liczba przestaje obowiązywać, i odnośnik do badania, z którego pochodzi — kliknij, żeby zobaczyć źródło."></p>
  </div>
  <div class="takeaways" id="takeaway-cards"></div>
  <details class="hero-ref">
    <summary data-en="Reference atmospheres and where they come from" data-pl="Atmosfery odniesienia i ich źródła"></summary>
    <div class="hero-stats">
      <div><span class="num" id="hs-tests">—</span><span class="lbl" data-en="test points normalized" data-pl="znormalizowanych punktów testowych"></span></div>
      <div><span class="num" id="hs-files">—</span><span class="lbl" id="hs-size"></span></div>
      <div><span class="num hot" id="hs-gap">—</span><span class="lbl" id="hs-gap-l"></span></div>
    </div>
    <p class="hero-note"
       data-en-html="Operating point audited here: the challenge's own lunar sentence — 30% O₂ or more at 10.2 psi or less, with the floor taken from its suit figure, &quot;filled with 100% oxygen to only 4.3 psi&quot;. Second marker: NASA's Artemis Surface Habitat reference design — &quot;a nominal atmospheric operating pressure of 10.2&nbsp;psia and 26.5% oxygen concentration and a capability of operating at 8.2&nbsp;psia and 34% oxygen&quot; (Kessler et al., Artemis Deep Space Habitation, IEEE Aerospace 2022, NTRS&nbsp;20220000245), where the solid ceiling is <span class=&quot;hs-gn&quot;></span> and <span class=&quot;hs-gc&quot;></span> points short. Neither is a figure from the corpus: they are the points the corpus is scored against. The same paper states that heritage ISS flammability data &quot;may not be valid or extensible&quot; to these environments."
       data-pl-html="Audytowany punkt pracy: własne zdanie challenge'u o Księżycu — 30% O₂ lub więcej przy 10,2 psi lub mniej, z dolną granicą wziętą z jego zdania o skafandrze: „wypełnione 100% tlenu do zaledwie 4,3 psi”. Drugi znacznik: referencyjny projekt habitatu powierzchniowego Artemis — „nominalne ciśnienie robocze 10,2&nbsp;psia przy stężeniu tlenu 26,5% oraz zdolność do pracy przy 8,2&nbsp;psia i 34% tlenu” (Kessler i in., Artemis Deep Space Habitation, IEEE Aerospace 2022, NTRS&nbsp;20220000245), gdzie sufit dla materiałów stałych jest krótszy o <span class=&quot;hs-gn&quot;></span> i <span class=&quot;hs-gc&quot;></span> punktu. Żadna z tych liczb nie pochodzi z korpusu: to punkty, względem których korpus jest oceniany. Ten sam artykuł stwierdza, że odziedziczone dane palności z ISS „mogą nie być ważne ani przenośne” na te warunki."></p>
  </details>
</section>

    <svg id="map-svg" role="img"
         data-en-al="Scatter plot of oxygen concentration against chamber pressure for microgravity combustion tests"
         data-pl-al="Wykres rozrzutu stężenia tlenu względem ciśnienia w komorze dla testów spalania w mikrograwitacji"></svg>
  </div>
  <div class="map-readout">
    <div class="card">
      <h3 data-en="The wall" data-pl="Ściana"></h3>
      <p data-en-html="Solid materials — fabrics, films, plastics, the things a habitat interior is made of — occupy a narrow oxygen band that ends at <strong id=&quot;mc-ceiling&quot;>—</strong>. Not one solid test in this corpus exists above it."
         data-pl-html="Materiały stałe — tkaniny, folie, plastiki, czyli to, z czego zbudowane jest wnętrze habitatu — zajmują wąskie pasmo tlenu kończące się na <strong id=&quot;mc-ceiling&quot;>—</strong>. Żaden test materiału stałego w tym korpusie nie istnieje powyżej."></p>
    </div>
    <div class="card">
      <h3 data-en="The second axis" data-pl="Druga oś"></h3>
      <p data-en-html="<strong id=&quot;mc-solid&quot;>—</strong> solid-material test points. <strong id=&quot;mc-blind&quot;>—</strong> of them have a chamber pressure recorded somewhere in the corpus — not always in the test table: BASS in its as-run matrix, BASS-II in its summary report, Saffire-I in its sensor workbook. Every one ran at <b id=&quot;mc-prange&quot;>—</b>. The pressure axis was never varied — only the oxygen was, and only downward."
         data-pl-html="<strong id=&quot;mc-solid&quot;>—</strong> punktów testowych materiałów stałych. <strong id=&quot;mc-blind&quot;>—</strong> z nich ma ciśnienie komory zapisane gdzieś w korpusie — nie zawsze w tabeli testu: BASS w macierzy „as run”, BASS-II w raporcie zbiorczym, Saffire-I w arkuszu czujników. Wszystkie pracowały przy <b id=&quot;mc-prange&quot;>—</b>. Osi ciśnienia nigdy nie zmieniano — zmieniano tylko tlen i tylko w dół."></p>
      <p data-en-html="<strong id=&quot;mc-nop&quot;>—</strong> have no pressure anywhere in the corpus: 9 Saffire-II points, 2 Saffire-III points and one BASS row."
         data-pl-html="<strong id=&quot;mc-nop&quot;>—</strong> nie ma ciśnienia nigdzie w korpusie: 9 punktów Saffire-II, 2 punkty Saffire-III i jeden wiersz BASS."></p>
    </div>
    <div class="card">
      <h3 data-en="What is covered" data-pl="Co jest pokryte"></h3>
      <p data-en-html="<strong id=&quot;flex-near&quot;>—</strong> droplet tests ran within 0.03 bar of the design pressure, but only <strong id=&quot;flex-high&quot;>—</strong> of them also reached 26.5% O₂. Droplets cover the design pressure; nothing covers the design atmosphere for the materials a habitat is built from."
         data-pl-html="<strong id=&quot;flex-near&quot;>—</strong> testów kropelkowych pracowało w granicach 0,03 bar od ciśnienia projektowego, ale tylko <strong id=&quot;flex-high&quot;>—</strong> z nich osiągnęło też 26,5% O₂. Krople pokrywają ciśnienie projektowe; nic nie pokrywa atmosfery projektowej dla materiałów, z których zbudowany jest habitat."></p>
      <p data-en-html="What those <strong id=&quot;flex-high2&quot;>—</strong> did: <strong id=&quot;dp-ext&quot;>—</strong> self-extinguished, against <strong id=&quot;dp-air&quot;>—</strong> of <strong id=&quot;dp-air-n&quot;>—</strong> in the same nitrogen-diluted series at cabin air. Both pressure and oxygen differ between the two cohorts, so this is an analogue, not a controlled comparison."
         data-pl-html="Co zrobiło tych <strong id=&quot;flex-high2&quot;>—</strong>: <strong id=&quot;dp-ext&quot;>—</strong> zgasło samo, wobec <strong id=&quot;dp-air&quot;>—</strong> z <strong id=&quot;dp-air-n&quot;>—</strong> w tej samej serii rozcieńczanej azotem przy powietrzu kabinowym. Obie osie różnią się między kohortami, więc to analogia, a nie porównanie kontrolowane."></p>
    </div>
  </div>
</section>

    <p class="sec-lede"
       data-en-html="Two ways into the same records. <b>Search the data</b> filters every test point yourself — no model involved. <b>Ask the SI</b> gives a written answer: a language model (DeepSeek V4.1 Flash) queries the <span class=&quot;n-tp&quot;></span> test points and verified quotes and cites every claim. Every source in either view opens the file and row it comes from; a citation the corpus cannot back is marked in red."

     data-pl-html="<b>Sprawdzone, zanim je zobaczysz.</b> Każda odpowiedź jest automatycznie sprawdzana względem korpusu: każde cytowane badanie musi istnieć, każdy cytat musi występować dosłownie w pliku NASA, a każda liczba jest porównywana ze streszczeniem korpusu i wynikami zapytań — odpowiedź z liczbą bez pokrycia wraca do modelu do poprawki, a odnośnik, którego nadal nie da się potwierdzić, jest oznaczony na czerwono. Kliknij dowolne źródło, żeby otworzyć rekord, który za nim stoi."></p>

    <h2 data-en="Oxygen is half the story" data-pl="Tlen to połowa historii"></h2>
    <p class="sec-lede"
       data-en="The challenge says flammability depends on oxygen and that air flow matters just as much in microgravity. The same test tables carry the flow setting for every test — a column this project never plotted. It is here, with the outcome the operator recorded in it."
       data-pl="Challenge mówi, że palność zależy od tlenu, a przepływ powietrza liczy się w mikrograwitacji równie mocno. Te same tabele niosą nastawę przepływu dla każdego testu — kolumna, której ten projekt nigdy nie narysował. Jest tutaj, razem z wynikiem, który operator w niej zapisał."></p>
    <details class="more"><summary data-en="Numbers and caveats" data-pl="Liczby i zastrzeżenia"></summary><p class="sec-note" id="flow-note"></p></details>
    <div class="atlas-ctrl" id="flow-scope"></div>
  </div>
